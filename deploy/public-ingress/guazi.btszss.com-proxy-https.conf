# Dedicated guazi HTTPS ingress; the business gateway is reached only by FRP.
server {
    listen 443 ssl;
    server_name guazi.btszss.com;

    ssl_certificate     /etc/nginx/ssl/btzss/btszss.com.pem;
    ssl_certificate_key /etc/nginx/ssl/btzss/btszss.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;
    access_log /var/log/nginx/guazi-access.log;
    error_log  /var/log/nginx/guazi-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
