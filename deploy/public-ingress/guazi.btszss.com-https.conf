# 公网入口独立 HTTPS 站点；FRP 后端就绪后再替换占位响应。
# 与 ops.tunyundata.online 位于不同配置文件，不修改现有业务。
server {
    listen 443 ssl;
    server_name guazi.btszss.com;

    ssl_certificate     /etc/nginx/ssl/btzss/btszss.com.pem;
    ssl_certificate_key /etc/nginx/ssl/btzss/btszss.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        return 200 "瓜子平台 HTTPS 入口已就绪；业务转发地址待配置。\n";
    }
}
