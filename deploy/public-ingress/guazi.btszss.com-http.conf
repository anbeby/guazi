# 测试阶段入口：仅监听 80；后端转发地址确认后再接入平台。
# 独立 server 块，不修改 ops.tunyundata.online。
server {
    listen 80;
    server_name guazi.btszss.com;

    location / {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        return 200 "瓜子平台 HTTP 入口已就绪；业务转发地址待配置。\n";
    }
}
