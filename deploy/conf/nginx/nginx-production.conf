# ==============================================================================
# 第十师瓜子油料数字化交易平台 —— Nginx 统一入口网关
# 挂载位置：/etc/nginx/nginx.conf（只读）
# 对外端口：宿主 ${GATEWAY_PORT:-8080} -> 容器 80
# ------------------------------------------------------------------------------
# 路由表（与 docs/01-总体技术架构.md 第 5 节部署拓扑一致）：
#   /               -> admin-web:80       PC 管理后台（Vue3 静态资源 + SPA 回退）
#   /api            -> api:8000           自研平台 REST（含 /api/docs、/api/v1/*）
#   /console/       -> api:8000           内置运营控制台（若由 api 托管）
#   /health         -> api:8000/health    网关+API 存活探测
#   /odoo           -> odoo:8069          Odoo ERP（含 /odoo/websocket 长轮询）
#   /websocket      -> odoo:8072          Odoo 17 长轮询/websocket 独立端口
#   /superset       -> superset:8088      BI 与产业驾驶舱
# ------------------------------------------------------------------------------
# 说明：本文件是**完整的** nginx 主配置（http 级 + 唯一的 server 块），
#       刻意不 include /etc/nginx/conf.d/*.conf：
#       官方镜像自带的 conf.d/default.conf 也监听 80 端口，一旦被 include 会与本
#       文件的 server 块冲突（duplicate default server / conflicting server name）。
#       因此本文件自成闭环，无需删除镜像内的任何文件，也不依赖宿主目录里有 conf.d。
#       如需追加站点或环境差异化配置，直接在下方 http 块内新增 server 块即可。
# ==============================================================================

user  nginx;
# worker 数按宿主 CPU 自动
worker_processes  auto;

# 日志统一写到 /var/log/nginx（已挂载到 ./data/nginx-logs，便于长期留存与检索）
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# 单 worker 连接数上限（含到后端的长连接）
events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    # ----------------------------- 基础 --------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 真实客户端 IP：网关是唯一入口，直接取对端地址；
    # 若前面还有 SLB/CDN，请改为 set_real_ip_from <SLB网段> + real_ip_header X-Forwarded-For
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header   X-Forwarded-For;

    log_format  gz_main  '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" "$http_x_forwarded_for" '
                         'rt=$request_time urt=$upstream_response_time '
                         'upstream=$upstream_addr';
    access_log  /var/log/nginx/access.log  gz_main;

    # --------------------------- 传输与超时 -----------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout   75s;
    keepalive_requests  1000;
    client_header_timeout  30s;
    client_body_timeout    300s;
    send_timeout           300s;

    # 上传上限：检测报告(PDF)/合同扫描件最大按 100MB 预留
    # 注意：该值必须 >= API 与 Odoo 自身的上传限制，否则会先被网关 413 拦截
    client_max_body_size  100m;
    client_body_buffer_size 256k;

    # 大文件上传/下载时避免把小文件也落盘
    client_body_temp_path /var/cache/nginx/client_temp;

    # 支持 web 长连接（Odoo /websocket 需要 HTTP/1.1 + Upgrade）
    # 说明：http 级不设 http2，TLS 由前置 SLB 卸载

    # ----------------------------- Gzip --------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_disable      "msie6";
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    # 注意：不要对图片/视频再压缩（收益为负）
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/vnd.ms-fontobject
        font/ttf
        font/otf
        image/svg+xml
        application/wasm;

    # --------------------------- 代理公共参数 ---------------------------------
    # 后端连接池：与 api / odoo 保持长连接，降低握手开销
    upstream gz_api {
        server api:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    upstream gz_odoo {
        server odoo:8069 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    # Odoo 17 长轮询专用端口（/websocket）
    upstream gz_odoo_ws {
        server odoo:8072 max_fails=1 fail_timeout=5s;
    }

    upstream gz_superset {
        server superset:8088 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    upstream gz_admin_web {
        server admin-web:80 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    map $http_upgrade $gz_connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Preserve the public HTTPS scheme across the Nginx -> FRP -> Nginx hop.
    map $http_x_forwarded_proto $gz_external_scheme {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }
    map $http_x_forwarded_port $gz_external_port {
        default $http_x_forwarded_port;
        ''      $server_port;
    }

    # 统一透传 X-Forwarded-*
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $gz_external_scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $gz_external_port;
    proxy_set_header Connection        "";
    # 超时：报表/Superset 查询与 Odoo 大批量导入都偏慢
    proxy_connect_timeout 15s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    proxy_buffering       on;
    proxy_buffer_size     16k;
    proxy_buffers         8 32k;
    proxy_busy_buffers_size 64k;

    # --------------------------- 限流（防爬与防爆破） --------------------------
    # 登录/刷新令牌接口：每 IP 每分钟 30 次
    limit_req_zone  $binary_remote_addr zone=gz_auth:10m  rate=30r/m;
    # 普通 API：每 IP 每秒 50 次（突发 100）
    limit_req_zone  $binary_remote_addr zone=gz_api:10m   rate=50r/s;
    # 上传接口：每 IP 每分钟 60 次
    limit_req_zone  $binary_remote_addr zone=gz_upload:10m rate=60r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=gz_conn:10m;

    # --------------------------- 安全响应头 -----------------------------------
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block"    always;

    # ==========================================================================
    # 主 server：统一入口
    # ==========================================================================
    server {
        listen       80;
        listen       [::]:80;
        # 8081：管理后台专用入口（与 8080 同一 server 块，便于按端口区分"前台/后台"）
        # 宿主映射见 docker-compose.yml 的 ADMIN_PORT，默认 8081。
        listen       8081;
        server_name  _;

        # charset 对中文响应体友好（api 已自带 application/json; charset=utf-8）
        charset utf-8;

        # 每个 IP 并发连接上限（防单机压满）
        limit_conn gz_conn 200;

        # ---------------------- 网关自身健康检查 ------------------------------
        # 供 docker healthcheck 与外部 LB 探活使用，不经过任何后端
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # 领导演示日报：只读挂载，数据由宿主 I 盘脚本更新。
        location = /report {
            absolute_redirect off;
            return 302 /report/;
        }
        location /report/ {
            alias /usr/share/nginx/html/report/;
            index index.html;
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ---------------------- 平台 API：/api -> api:8000 ---------------------
        # 路径原样透传（不做 rewrite），因此后端路由必须带 /api 前缀：
        #   /api/v1/auth/login、/api/docs、/api/openapi.json
        location /api/ {
            limit_req zone=gz_api burst=100 nodelay;
            proxy_pass http://gz_api;
            proxy_set_header Connection "";
            # 大文件上传（商品图片、检测报告直传）
            client_max_body_size 100m;
            proxy_request_buffering off;
            # 流式响应（导出 Excel/PDF、SSE）不缓冲
            proxy_buffering off;
            proxy_cache off;
        }

        # 登录/刷新令牌接口单独限流，防暴力破解
        location = /api/v1/auth/login {
            limit_req zone=gz_auth burst=10 nodelay;
            proxy_pass http://gz_api;
        }
        location = /api/v1/auth/refresh {
            limit_req zone=gz_auth burst=10 nodelay;
            proxy_pass http://gz_api;
        }

        # 文件上传接口单独限流
        location /api/v1/files/ {
            limit_req zone=gz_upload burst=20 nodelay;
            client_max_body_size 100m;
            proxy_request_buffering off;
            proxy_pass http://gz_api;
        }

        # API 健康检查（文档要求 /health 暴露在根路径）
        location = /health {
            access_log off;
            proxy_pass http://gz_api/health;
        }
        location = /ready {
            access_log off;
            proxy_pass http://gz_api/ready;
        }

        # OpenAPI 文档与内置控制台
        #   文档路径按 docs/04-接口规范.md 挂在 /api 前缀下：/api/docs、/api/redoc
        #   因此这里原样透传（不做 rewrite），后端只需提供 /api/docs。
        #   若后端把文档挂在根路径 /docs，请把下面两处 proxy_pass 改为
        #       rewrite ^/api/(docs|redoc)$ /$1 break;  proxy_pass http://gz_api;
        location = /api/docs {
            proxy_pass http://gz_api;
        }
        location = /api/redoc {
            proxy_pass http://gz_api;
        }
        location = /api/openapi.json {
            proxy_pass http://gz_api;
        }

        # ---------------------- 内置运营控制台（免构建，PC） --------------------
        # 由 api 服务托管静态页，直连真实 REST API，无需前端构建工具链
        location /console/ {
            proxy_pass http://gz_api;
            proxy_set_header Host $host;
        }

        # ---------------------- 移动端 H5（手机浏览器直接访问） -----------------
        # 访问：http://<电脑IP>:8080/m/
        # 功能：商户查看/发布商品、处理订单、库存查看、扫码溯源
        location /m/ {
            proxy_pass http://gz_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $gz_external_scheme;
            # H5 页面必须不缓存，保证发版即时生效
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        # 容许 /m 不带斜杠访问
        location = /m {
            absolute_redirect off;
            return 301 /m/;
        }

        # ---------------------- Odoo ERP：/odoo -> /web ------------------------
        # Odoo 17 的网页、资源和 RPC 使用根路径 /web；网关给 /odoo 一个入口。
        location = /odoo {
            absolute_redirect off;
            return 302 /web/login;
        }
        location ^~ /web {
            proxy_pass http://gz_odoo;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $gz_external_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $gz_connection_upgrade;
            # Odoo 大附件上传/报表导出超时放宽
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            client_max_body_size 100m;
            proxy_request_buffering off;
        }

        # Odoo 17 长轮询 / websocket：优先代理到 8072 独立端口
        # 浏览器可能请求 /websocket 或 /odoo/websocket，两种都覆盖
        location /websocket {
            proxy_pass http://gz_odoo_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $gz_connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $gz_external_scheme;
            # websocket 必须关闭缓冲，且不能有短读超时
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location = /odoo/websocket {
            proxy_pass http://gz_odoo_ws/websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $gz_connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $gz_external_scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # ---------------------- Superset BI：/superset -> superset:8088 --------
        # Superset 4.x 同样通过 X-Forwarded-* 与 ENABLE_PROXY_FIX 生成正确 URL，
        # 需在 superset_config.py 中开启 ENABLE_PROXY_FIX = True
        location /superset {
            proxy_pass http://gz_superset;
            proxy_set_header X-Forwarded-Prefix /superset;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $gz_connection_upgrade;
            proxy_redirect off;
            # 大屏 SQL Lab 查询可能很慢
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # 静态资源缓存：Vite 构建产物带内容哈希，可长缓存
        # 该规则必须在 location / 之前匹配（nginx 前缀匹配按最长优先，此处用正则更明确）
        location ~* ^/(assets|static|fonts|img|images)/.*\.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|eot|map)$ {
            proxy_pass http://gz_admin_web;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # ---------------------- 前端管理后台：/ -> admin-web:80 -----------------
        # SPA 回退：未命中的路径统一交给 index.html 由前端路由处理
        location / {
            proxy_pass http://gz_admin_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $gz_external_scheme;
            # index.html 不缓存，保证前端发版即时生效
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 隐藏文件与版本控制目录一律拒绝
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
        }
    }
}
