; ==============================================================================
; 第十师瓜子油料数字化交易平台 —— Odoo 17 CE 配置
; 挂载位置：/etc/odoo/odoo.conf（**必须可写**，见下方警告）
; ------------------------------------------------------------------------------
; 【必读：这个文件在运行时会被官方 entrypoint 重写】
;   Odoo 官方镜像（odoo:17）的 /entrypoint.sh 每次容器启动都会重新生成
;   /etc/odoo/odoo.conf（默认只含 [options] / addons_path / data_dir 三段），
;   然后：
;     · 把 HOST / PORT / USER / PASSWORD 以命令行参数
;       --db_host --db_port --db_user --db_password 的形式传给 odoo 进程；
;     · 把 WORKERS / MAX_CRON_THREADS / LIMIT_MEMORY_SOFT / LIMIT_MEMORY_HARD /
;       LIMIT_TIME_CPU / LIMIT_TIME_REAL / LIMIT_REQUEST / LIST_DB / PROXY_MODE /
;       ADMIN_PASSWD / SERVER_WIDE_MODULES 也拼成命令行参数；
;     · 用 `sed -i` 就地修改本文件（追加 admin_passwd / server_wide_modules）。
;
;   结论（很重要）：
;   1) **本文件里的值在运行期大多不生效**，真正生效的是 docker-compose.yml 中
;      odoo 服务的 environment（因为 entrypoint 会重写本文件并改用命令行参数）。
;      需要调整 Odoo 行为时，请优先改 deploy/.env 与 compose 的 environment。
;   2) 本文件**不能以 :ro（只读）挂载**，否则 entrypoint 的 `sed -i` 会失败并导致
;      容器启动异常。compose 中该挂载已刻意不加 :ro。
;   3) 本文件保留的意义：a) 作为"可用配置项清单"的参考模板；
;      b) 承载 entrypoint **不支持**的配置项（如 dbfilter / db_maxconn / log_level /
;      smtp_*），这类项要么在此文件中被 entrypoint 的 sed 保留（未命中则不删），
;      要么建议改到 Odoo 界面「设置 -> 技术 -> 系统参数」中配置（更可靠）。
;   4) 若确需完全掌控配置，可自建镜像覆盖 ENTRYPOINT 或改用 OVERRIDE_CONF_FILE 方案，
;      但这属于 ../odoo 业务镜像的职责，不在本编排范围内。
;
; 校验方式：
;   docker compose exec odoo odoo --help | head -40
;   docker compose exec odoo cat /etc/odoo/odoo.conf   # 查看 entrypoint 重写后的实际内容
; ==============================================================================

[options]

; ------------------------------- 数据库连接 ----------------------------------
; 占位说明：实际由 compose 的环境变量 HOST/PORT/USER/PASSWORD 覆盖
;   真实值来自 deploy/.env 的 POSTGRES_* 变量，容器内主机名固定为 postgres
db_host = postgres
db_port = 5432
db_user = gz
; db_password is supplied by the Odoo container entrypoint from PASSWORD.
; 默认连接的数据库（Odoo 业务库）；真实值来自 .env 的 ODOO_DB
db_name = gz_odoo
; 列表页是否显示数据库管理界面（生产建议设为 False 并由 dbfilter 限定）
list_db = True
; 只允许访问以下数据库，防止通过 db 选择器跨库访问
; 阶段一只有一个 Odoo 库；阶段二多租户时改为 ^gz_.*$ 这类正则
dbfilter = ^gz_odoo$
; 数据库最大连接数（须大于 workers 总和 + 常规连接余量）
db_maxconn = 64
; 连接池空闲回收（秒）
db_template = template0

; ------------------------------- 模块路径 ------------------------------------
; /mnt/extra-addons   自研 gz_* 模块（由 compose 以具名卷或源码挂载注入）
; 第二个路径为官方镜像内 Odoo 自带 addons（Odoo 17 官方镜像的实际安装路径）
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; ------------------------------- 数据目录 ------------------------------------
; filestore（附件实体）、session、多进程文件存储；必须持久化到具名卷 odoo_data
data_dir = /var/lib/odoo
; 运行日志：留空写入 stdout，由 Docker 日志驱动收集（不落容器内磁盘）
logfile = 
log_level = info
; 是否把完整日志写入 logfile（False = 仅 stdout）
log_handler = :INFO

; ------------------------------- 进程与性能 ----------------------------------
; worker 进程数：经验值 = CPU 核数/2 + 1；生产建议 4（8 核），
; 开发/演示机内存紧张时设为 0（= 单进程多线程模式，便于调试）
workers = 2
; 定时任务线程数（结算跑批、超时关闭询价等）
max_cron_threads = 2
; 单请求 CPU / 墙钟时间上限（秒）：防止报表把 worker 长期占死
limit_time_cpu = 600
limit_time_real = 1200
; 单请求内存软/硬上限（MB）：超硬限直接杀 worker（Odoo 默认 2560）
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
; 反向代理后必须开启，否则 Odoo 无法识别 https、回调 URL 生成错误
proxy_mode = True
; 关于域名白名单：Odoo 17 由 db-filter 与服务地址共同决定可访问范围，
; 上线后请确保 nginx 的 server_name / 公网域名与 Odoo 的 web.base.url 一致
; （设置 -> 技术 -> 系统参数 -> web.base.url），否则邮件与回调链接会指向 localhost。

; --------------------------- 管理员与安全 ------------------------------------
; 数据库管理主密码（创建/备份/还原数据库时使用），真实值来自 .env 的 ODOO_ADMIN_PASSWD
admin_passwd = CHANGE_ME_FROM_ENV
; 是否允许导入/导出（运营需要，生产如需收紧改为 False）
; import 相关由界面权限控制，此处保留默认

; ------------------------------- 邮件 ----------------------------------------
; 留空表示不配置出站邮件（合同/审核通知会写入队列但发不出去）
; 真实值来自 compose 的 SMTP_* 环境变量
smtp_server = 
smtp_port = 25
smtp_ssl = False
smtp_user = 
smtp_password = 
email_from = 

; ------------------------------- 界面与本地化 --------------------------------
; 默认语言与初始时区（首次建库时生效；界面语言为中文 zh_CN）
; 时区以 TZ=Asia/Shanghai 环境变量为准，Odoo 用户级时区在个人设置中选择
; 开启 PWA / 长轮询（Odoo 17 聊天与通知默认走 websocket，容器内 8072 端口）
; 注意：websocket 需要 nginx 的 /websocket 路径代理（见 conf/nginx/nginx.conf）
; 与 --db-filter 配合的多库场景在阶段二启用
; 关闭演示数据由 compose 的 WITHOUT_DEMO 环境变量控制（默认 all）
