# ==============================================================================
# 第十师瓜子油料数字化交易平台 —— Redis 7 配置
# 挂载位置：/usr/local/etc/redis/redis.conf
# 启动方式（见 deploy/docker-compose.yml）：
#   redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
# ---
# 重要：本文件不写 requirepass（配置文件无法读取容器环境变量），
#       密码由 compose 的 --requirepass 命令行参数注入，命令行优先级更高。
#       masterauth / replica 相关项同理，如需从库请另行配置。
# 用途：JWT 黑名单、幂等键、会话、热点缓存、驾驶舱聚合缓存、分布式锁、限流计数
# ==============================================================================

# ------------------------------- 网络 ----------------------------------------
# 只监听容器网络，容器内通过服务名 redis:6379 访问
bind 0.0.0.0
protected-mode yes
port 6379
# TCP 长连接保活，避免 nginx/api 侧空闲连接被静默断开
tcp-keepalive 300
tcp-backlog 511
# 空闲连接超时（0 = 不主动断开，交给客户端连接池管理）
timeout 0

# ------------------------------- 通用 ----------------------------------------
daemonize no
# 关闭 supervised（容器内由 PID 1 直接托管）
supervised no
loglevel notice
# 日志输出到 stdout，由 Docker json-file 驱动收集（已在 compose 中限制 10m x 3）
logfile ""
# 数据库数量：0=业务缓存 1=会话/Token黑名单 2=限流与队列 3=预留
databases 16

# ---------------------------- RDB 快照持久化 --------------------------------
# 触发条件：900 秒内至少 1 次写 / 300 秒内至少 10 次写 / 60 秒内至少 1 万次写
save 900 1
save 300 10
save 60 10000
# 后台快照失败时停止写入，避免数据静默丢失（会向上抛错，便于监控发现）
stop-writes-on-bgsave-error yes
# 快照压缩（CPU 换磁盘）
rdbcompression yes
# 快照文件带 CRC64 校验
rdbchecksum yes
# 快照文件名与目录（目录即具名卷 redis_data）
dbfilename dump.rdb
dir /data

# ------------------------------- AOF 持久化 ----------------------------------
# 开启 AOF：交易类幂等键与 Token 黑名单对持久性敏感
appendonly yes
# 每秒 fsync 一次：性能与安全的平衡点（最多丢 1 秒数据）
appendfsync everysec
# AOF 重写期间不 fsync，避免磁盘抖动时阻塞写请求
no-appendfsync-on-rewrite no
# AOF 自动重写阈值：增长到上次重写后的 100% 且不小于 64MB
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
# 启动时若 AOF 尾部截断（异常宕机），加载尽可能多的数据而不是拒绝启动
aof-load-truncated yes
# 使用 RDB 前导 + AOF 混合格式，加快重启加载速度
aof-use-rdb-preamble yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"

# ---------------------------- 内存与淘汰策略 ---------------------------------
# 上限 2GB：请按宿主内存调整（建议不超过宿主机内存的 1/8；
# 4C8G 开发机建议降到 512mb）。
maxmemory 2gb
# 淘汰策略：优先淘汰设置了 TTL 的 key（会话/缓存），
# 没有可淘汰的 TTL key 时才淘汰 LRU。
# 注意：幂等键与 Token 黑名单本身带 TTL，属于"可淘汰"范畴；
# 若要求绝对不丢，请把 maxmemory-policy 改为 noeviction 并保证内存充足。
maxmemory-policy volatile-lru
# LRU 采样精度（越大越准、CPU 越高）
maxmemory-samples 5
# 内存碎片整理：碎片率超过 1.2 且物理内存占用 > 100MB 时启用
activedefrag yes

# --------------------------- 慢查询与延迟监控 --------------------------------
# 超过 10ms 记录慢日志（缓存/幂等键查询应远低于此值）
slowlog-log-slower-than 10000
slowlog-max-len 128
# 延迟监控阈值（毫秒），用于排查 AOF 重写、大 key 造成的卡顿
latency-monitor-threshold 100
# 大 key / 热 key 提示（业务侧避免把整棵列表/大 JSON 塞进单个 key）
# 建议：单 key value 不超过 100KB，避免 HGETALL/SMEMBERS 全量拉取

# ------------------------------- 安全 ----------------------------------------
# 危险命令重命名/禁用（requirepass 之外的纵深防御）
# 注意：CONFIG/DEBUG 在容器运维时可能需要，若要用请先恢复名称并重启。
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
# 说明：RENAME 后原命令名即失效，客户端调用会报 unknown command。

# --------------------------- 客户端与通知 ------------------------------------
# 客户端空闲连接不主动断开（连接池友好）
maxclients 10000
# 键空间通知：供 worker 监听订单/结算事件（__keyevent@0__:expired 等）
notify-keyspace-events "Ex"
