<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>第十师瓜子油料数字化交易平台 · 运营控制台</title>
<style>
  :root{
    --bg:#f4f6fa; --panel:#fff; --line:#e4e8f0; --text:#1f2937; --muted:#6b7280;
    --primary:#1d6f42; --primary-2:#2e8b57; --accent:#c8a44a; --danger:#d14343;
    --warn:#c98a12; --ok:#1d6f42; --sidebar:#12261c; --sidebar-2:#1b3a2b;
    --radius:10px; --shadow:0 2px 10px rgba(17,38,28,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  a{color:var(--primary);text-decoration:none}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(46,139,87,.12)}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;color:var(--text)}
  .btn:hover{border-color:var(--primary-2);color:var(--primary)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-2)}
  .btn.danger{color:var(--danger);border-color:#f0cccc}
  .btn.sm{padding:3px 9px;font-size:12px;border-radius:6px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}

  /* ---------- 登录 ---------- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#12261c 0%,#1d6f42 55%,#c8a44a 140%)}
  #login .card{width:400px;background:#fff;border-radius:16px;padding:34px 32px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
  #login h1{margin:0 0 6px;font-size:20px;color:var(--primary)}
  #login p.sub{margin:0 0 22px;color:var(--muted);font-size:13px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
  .field input{width:100%}
  .tip{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.8;background:#f8faf9;border:1px dashed var(--line);border-radius:8px;padding:10px 12px}

  /* ---------- 布局 ---------- */
  #app{display:none;min-height:100vh}
  .layout{display:flex;min-height:100vh}
  .sidebar{width:222px;background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2));color:#d9e6df;flex:0 0 222px}
  .brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
  .brand b{display:block;font-size:15px;color:#fff;letter-spacing:.4px}
  .brand span{font-size:11px;color:#8fb3a2}
  .nav{padding:10px 8px}
  .nav a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;color:#c9dcd3;font-size:13.5px;margin-bottom:2px}
  .nav a:hover{background:rgba(255,255,255,.07);color:#fff}
  .nav a.active{background:var(--primary);color:#fff;font-weight:600}
  .nav .grp{font-size:11px;color:#7ea08f;padding:12px 12px 4px;letter-spacing:1px}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:5}
  .topbar .title{font-weight:600}
  .topbar .who{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
  .content{padding:18px 20px 40px;flex:1}

  /* ---------- 组件 ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
  .card>header{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .card>header h3{margin:0;font-size:14.5px}
  .card>header .hint{font-size:12px;color:var(--muted)}
  .card .body{padding:14px 16px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .kpi .k{font-size:12px;color:var(--muted)}
  .kpi .v{font-size:23px;font-weight:700;color:var(--primary);margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .u{font-size:12px;color:var(--muted);margin-left:4px;font-weight:400}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
  th{background:#f8faf9;color:var(--muted);font-weight:600;white-space:nowrap}
  tbody tr:hover{background:#fbfdfc}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid transparent;white-space:nowrap}
  .tag.gray{background:#f1f3f6;color:#5b6472}
  .tag.green{background:#e7f5ec;color:var(--ok);border-color:#cbe7d6}
  .tag.blue{background:#e8f1fb;color:#1c5fa8;border-color:#cfe1f5}
  .tag.orange{background:#fdf3e2;color:var(--warn);border-color:#f4e2c2}
  .tag.red{background:#fdecec;color:var(--danger);border-color:#f6d5d5}
  .pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 4px 2px;color:var(--muted);font-size:13px}
  .empty{padding:34px 10px;text-align:center;color:var(--muted)}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:8px}
  .bars .bar{flex:1;background:linear-gradient(180deg,var(--primary-2),var(--primary));border-radius:4px 4px 0 0;min-height:2px;position:relative}
  .bars .bar span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
  .bars .bar em{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--primary);font-style:normal}

  /* ---------- 弹窗 / 提示 ---------- */
  .mask{position:fixed;inset:0;background:rgba(12,24,18,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:560px;max-height:86vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.3)}
  .modal header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal header h3{margin:0;font-size:15px}
  .modal .body{padding:16px 18px}
  .modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .toast{position:fixed;top:16px;right:16px;z-index:99;display:flex;flex-direction:column;gap:8px}
  .toast div{background:#12261c;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:340px}
  .toast div.err{background:var(--danger)}
  .toast div.ok{background:var(--primary)}
  .mono{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:12px}
  .muted{color:var(--muted)}
  @media (max-width:820px){
    .sidebar{display:none}
    .content{padding:12px}
  }
</style>
</head>
<body>

<!-- ============================ 登录 ============================ -->
<div id="login">
  <form class="card" id="loginForm" autocomplete="on">
    <h1>第十师瓜子油料数字化交易平台</h1>
    <p class="sub">产业互联网交易 · 智慧园区 · 商户经营 · 数据分析</p>
    <div class="field">
      <label>账号</label>
      <input id="loginUser" name="username" value="admin" autocomplete="username" required />
    </div>
    <div class="field">
      <label>密码</label>
      <input id="loginPass" name="password" type="password" value="Admin@123" autocomplete="current-password" required />
    </div>
    <button class="btn primary" style="width:100%;padding:10px" type="submit">登 录</button>
    <div class="tip">
      演示账号：<br />
      平台管理员 <b>admin / Admin@123</b><br />
      园区运营 <b>park01 / Gz@123456</b>　供应商 <b>jinsui / Gz@123456</b><br />
      商户 <b>fengyuan / Gz@123456</b>　采购商 <b>gongxiao / Gz@123456</b>
    </div>
  </form>
</div>

<!-- ============================ 主体 ============================ -->
<div id="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><b>瓜子油料交易平台</b><span>第十师北屯市 · 运营控制台</span></div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <div class="main">
      <div class="topbar">
        <div class="title" id="pageTitle">数据驾驶舱</div>
        <div class="who">
          <span id="whoami" class="muted"></span>
          <a href="/api/docs" target="_blank">接口文档</a>
          <a href="/m/" target="_blank">移动端</a>
          <button class="btn sm" id="logoutBtn">退出</button>
        </div>
      </div>
      <div class="content" id="view"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
"use strict";
/* =========================================================================
 * 免构建运营控制台（直连真实 REST API，无任何模拟数据）
 * 统一信封：{code,message,data}；分页：data.items / data.total
 * ========================================================================= */

const API = "/api/v1";
const store = {
  token: localStorage.getItem("gz_token") || "",
  user: null,
};

/* ------------------------------- 基础工具 ------------------------------- */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v, digits = 2) => {
  const n = Number(v ?? 0);
  if (!isFinite(n)) return "0";
  return n.toLocaleString("zh-CN", { minimumFractionDigits: digits, maximumFractionDigits: digits });
};
const int = (v) => Number(v ?? 0).toLocaleString("zh-CN");
const dt = (v) => (v ? String(v).replace("T", " ").slice(0, 19) : "-");
const day = (v) => (v ? String(v).slice(0, 10) : "-");
const qs = (obj) => {
  const p = new URLSearchParams();
  Object.entries(obj || {}).forEach(([k, v]) => {
    if (v !== undefined && v !== null && v !== "") p.append(k, v);
  });
  const s = p.toString();
  return s ? "?" + s : "";
};

function toast(msg, kind = "") {
  const box = $("#toast");
  const el = document.createElement("div");
  el.className = kind;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

async function api(path, { method = "GET", body, query } = {}) {
  const headers = { Accept: "application/json" };
  if (store.token) headers.Authorization = "Bearer " + store.token;
  let payload;
  if (body instanceof FormData) payload = body;
  else if (body !== undefined) {
    headers["Content-Type"] = "application/json";
    payload = JSON.stringify(body);
  }
  const res = await fetch(API + path + qs(query), { method, headers, body: payload });
  let data = null;
  const text = await res.text();
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
  if (res.status === 401) {
    store.token = "";
    localStorage.removeItem("gz_token");
    showLogin();
    throw new Error((data && data.message) || "登录已失效，请重新登录");
  }
  if (!data) throw new Error("服务响应异常（HTTP " + res.status + "）");
  if (data.code !== 0) throw new Error(data.message || "请求失败");
  return data.data;
}
const GET = (p, q) => api(p, { query: q });
const POST = (p, b) => api(p, { method: "POST", body: b });
const PUT = (p, b) => api(p, { method: "PUT", body: b });
const DEL = (p) => api(p, { method: "DELETE" });

/* ------------------------------- 字典与标签 ----------------------------- */
const DICT = {
  enterprise_type: { merchant: "商户", supplier: "供应商", buyer: "采购商", platform: "平台" },
  audit_status: { pending: ["待审核", "orange"], approved: ["已通过", "green"], rejected: ["已驳回", "red"] },
  ent_status: { active: ["正常", "green"], disabled: ["停用", "gray"] },
  product_status: { draft: ["草稿", "gray"], published: ["已上架", "green"], offline: ["已下架", "gray"], rejected: ["已驳回", "red"] },
  grade: { special: "特级", first: "一级", second: "二级", mixed: "统货" },
  unit: { ton: "吨", kg: "千克", bag: "袋", piece: "件" },
  order_status: {
    draft: ["草稿", "gray"], pending_confirm: ["待确认", "orange"], confirmed: ["已确认", "blue"],
    delivering: ["发货中", "blue"], completed: ["已完成", "green"], settled: ["已结算", "green"], cancelled: ["已取消", "red"],
  },
  inquiry_status: {
    draft: ["草稿", "gray"], submitted: ["待报价", "orange"], quoted: ["已报价", "blue"],
    confirmed: ["已成交", "green"], closed: ["已关闭", "gray"], cancelled: ["已取消", "red"],
  },
  quotation_status: { submitted: ["待确认", "orange"], accepted: ["已接受", "green"], rejected: ["已拒绝", "red"], expired: ["已失效", "gray"] },
  move_type: { in: "入库", out: "出库", transfer: "调拨", adjust: "调整", check: "盘点" },
  settle_status: { pending: ["待确认", "orange"], confirmed: ["已确认", "blue"], settled: ["已结清", "green"], cancelled: ["已取消", "red"] },
  pay_status: { unpaid: ["未回款", "orange"], partial: ["部分回款", "blue"], paid: ["已回款", "green"] },
  stall_status: { free: ["空闲", "gray"], rented: ["已租", "green"], reserved: ["预留", "orange"], maintenance: ["维护", "red"] },
  quality_status: { pending: ["待检", "orange"], qualified: ["合格", "green"], unqualified: ["不合格", "red"] },
  settle_type: { receivable: "应收", payable: "应付", park_fee: "园区费用" },
  direction: { in: "收入", out: "支出" },
};
const dict = (group, key, rawIfMissing = true) => {
  const item = (DICT[group] || {})[key];
  if (item === undefined) return rawIfMissing ? (key ?? "-") : "-";
  return Array.isArray(item) ? item[0] : item;
};
const tag = (group, key) => {
  const item = (DICT[group] || {})[key];
  if (Array.isArray(item)) return `<span class="tag ${item[1]}">${esc(item[0])}</span>`;
  const label = item !== undefined ? item : (key ?? "-");
  return `<span class="tag gray">${esc(label)}</span>`;
};

/* ------------------------------- 弹窗 ------------------------------- */
function openModal({ title, bodyHtml, okText = "确定", onOk, width }) {
  const root = $("#modalRoot");
  root.innerHTML =
    `<div class="mask"><div class="modal" ${width ? `style="max-width:${width}px"` : ""}>
      <header><h3>${esc(title)}</h3><button class="btn sm" data-close>关闭</button></header>
      <div class="body">${bodyHtml}</div>
      <footer>
        <button class="btn" data-close>取消</button>
        <button class="btn primary" data-ok>${esc(okText)}</button>
      </footer>
    </div></div>`;
  const close = () => (root.innerHTML = "");
  root.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", close));
  const okBtn = root.querySelector("[data-ok]");
  okBtn.addEventListener("click", async () => {
    if (!onOk) return close();
    okBtn.disabled = true;
    try {
      const keep = await onOk(root.querySelector(".modal"));
      if (keep !== false) close();
    } catch (e) {
      toast(e.message, "err");
    } finally {
      okBtn.disabled = false;
    }
  });
  return { close, root };
}

function pager(state, onGo) {
  const pages = Math.max(1, Math.ceil((state.total || 0) / state.pageSize));
  const el = document.createElement("div");
  el.className = "pager";
  el.innerHTML = `<span>共 ${int(state.total)} 条，第 ${state.page}/${pages} 页</span>`;
  const prev = document.createElement("button");
  prev.className = "btn sm"; prev.textContent = "上一页"; prev.disabled = state.page <= 1;
  prev.onclick = () => onGo(state.page - 1);
  const next = document.createElement("button");
  next.className = "btn sm"; next.textContent = "下一页"; next.disabled = state.page >= pages;
  next.onclick = () => onGo(state.page + 1);
  el.append(prev, next);
  return el;
}

function tableCard({ title, hint, toolbarHtml, columns, rows, state, onGo }) {
  const table = document.createElement("div");
  table.className = "card";
  table.innerHTML = `<header><h3>${esc(title)}</h3><div class="hint">${hint || ""}</div><div class="toolbar">${toolbarHtml || ""}</div></header>`;
  const body = document.createElement("div");
  body.className = "body";
  if (!rows.length) {
    body.innerHTML = `<div class="empty">暂无数据</div>`;
  } else {
    const thead = columns.map((c) => `<th class="${c.num ? "num" : ""}">${esc(c.title)}</th>`).join("");
    const tbody = rows
      .map((row) => "<tr>" + columns.map((c) => `<td class="${c.num ? "num" : ""}">${c.render(row)}</td>`).join("") + "</tr>")
      .join("");
    body.innerHTML = `<div style="overflow:auto"><table><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table></div>`;
  }
  table.appendChild(body);
  if (state && onGo) table.appendChild(pager(state, onGo));
  return table;
}

/* ------------------------------- 菜单与路由 ----------------------------- */
const MENU = [
  { grp: "总览" },
  { key: "dashboard", title: "数据驾驶舱", perm: "data:read" },
  { grp: "商户与商品" },
  { key: "enterprises", title: "商户档案", perm: "merchant:read" },
  { key: "products", title: "商品中心", perm: "product:read" },
  { key: "categories", title: "商品分类", perm: "product:read" },
  { grp: "仓储与交易" },
  { key: "inventory", title: "库存管理", perm: "inventory:read" },
  { key: "moves", title: "出入库流水", perm: "inventory:read" },
  { key: "inquiries", title: "询价与报价", perm: "trade:read" },
  { key: "orders", title: "订单管理", perm: "trade:read" },
  { key: "contracts", title: "合同管理", perm: "trade:read" },
  { grp: "结算与园区" },
  { key: "settlements", title: "结算单", perm: "settlement:read" },
  { key: "flows", title: "交易流水", perm: "settlement:read" },
  { key: "parks", title: "园区与档口", perm: "park:read" },
  { key: "trace", title: "溯源批次", perm: "trace:read" },
  { grp: "系统" },
  { key: "users", title: "用户管理", perm: "user:read" },
  { key: "system", title: "系统状态", perm: null },
];

const state = { view: "dashboard", params: {}, children: [{}] };
const can = (perm) => !perm || (store.user && (store.user.is_superuser || (store.user.permissions || []).includes(perm)));

function buildNav() {
  const nav = $("#nav");
  nav.innerHTML = MENU.map((m) => {
    if (m.grp) return `<div class="grp">${esc(m.grp)}</div>`;
    if (!can(m.perm)) return "";
    return `<a href="#/${m.key}" data-key="${m.key}" class="${state.view === m.key ? "active" : ""}">${esc(m.title)}</a>`;
  }).join("");
  nav.querySelectorAll("a").forEach((a) =>
    a.addEventListener("click", (e) => {
      e.preventDefault();
      location.hash = "#/" + a.dataset.key;
    })
  );
}

function currentMenu() {
  return MENU.find((m) => m.key === state.view) || { title: "数据驾驶舱" };
}

async function route() {
  const hash = (location.hash || "#/dashboard").replace(/^#\/?/, "");
  const parts = hash.split("/").filter(Boolean);
  const key = parts[0] || "dashboard";
  const menu = MENU.find((m) => m.key === key);
  if (!menu || (menu.perm && !can(menu.perm))) {
    state.view = "dashboard";
  } else {
    state.view = key;
  }
  state.params = { id: parts[1] };
  buildNav();
  $("#pageTitle").textContent = currentMenu().title;
  const view = $("#view");
  view.innerHTML = `<div class="empty">加载中…</div>`;
  try {
    await (VIEWS[state.view] || VIEWS.dashboard)(view, state.params);
  } catch (e) {
    view.innerHTML = `<div class="card"><div class="body empty">加载失败：${esc(e.message)}</div></div>`;
  }
}

/* =============================== 视图实现 =============================== */

const VIEWS = {};

/* ------------------------------ 数据驾驶舱 ------------------------------ */
VIEWS.dashboard = async (root) => {
  const [overview, trend, industry] = await Promise.all([
    GET("/dashboard/overview", { refresh: true }),
    GET("/dashboard/trend", { days: 14 }),
    GET("/dashboard/industry"),
  ]);
  const kpi = (k, v, u) => `<div class="kpi"><div class="k">${esc(k)}</div><div class="v">${v}${u ? `<span class="u">${esc(u)}</span>` : ""}</div></div>`;
  const max = Math.max(1, ...trend.order_amount.map((x) => Number(x)));
  const bars = trend.dates
    .map((d, i) => {
      const amount = Number(trend.order_amount[i] || 0);
      const h = Math.round((amount / max) * 140) + 2;

async function orderDetail(id, onDone) {
  const [d, timeline] = await Promise.all([GET(`/orders/${id}`), GET(`/orders/${id}/timeline`)]);
  const items = d.items.map((i) => `<tr><td>${esc(i.product_name || "-")}<br /><span class="muted">${esc(i.spec || "")}</span></td>
      <td class="mono">${esc(i.batch_no || "-")}</td><td class="num">${num(i.quantity, 3)}</td>
      <td class="num">${num(i.delivered_quantity, 3)}</td><td class="num">${num(i.unit_price)}</td>
      <td class="num">${num(i.amount)}</td></tr>`).join("");
  const steps = timeline.map((t) => `<div style="padding:6px 0;border-bottom:1px dashed var(--line)">
      <b>${esc(t.title)}</b> <span class="muted">${dt(t.occurred_at)}</span><br /><span class="muted">${esc(t.description || "")}</span></div>`).join("");
  const actions = [];
  if (can("trade:write")) {
    if (d.status === "pending_confirm") {
      actions.push(`<button class="btn primary" data-act="confirm">供应商确认订单</button>`);
      actions.push(`<button class="btn danger" data-act="cancel">取消订单</button>`);
    }
    if (d.status === "confirmed") {
      actions.push(`<button class="btn primary" data-act="deliver">发货</button>`);
      actions.push(`<button class="btn" data-act="complete">直接完成</button>`);
      actions.push(`<button class="btn danger" data-act="cancel">取消订单</button>`);
    }
    if (d.status === "delivering") actions.push(`<button class="btn primary" data-act="complete">订单完成</button>`);
    if (d.status === "draft") actions.push(`<button class="btn danger" data-act="cancel">取消订单</button>`);
    if (d.status === "completed" && !d.contract_id) actions.push(`<button class="btn" data-act="contract">生成合同</button>`);
  }
  openModal({
    title: `订单 ${d.order_no}`,
    okText: "关闭", onOk: () => true, width: 860,
    bodyHtml: `<div class="kpis" style="margin-bottom:12px">

        物流：${esc(d.logistics_company || "-")} ${esc(d.logistics_no || "")}
      </div>
      <table><thead><tr><th>商品</th><th>批次</th><th class="num">数量</th><th class="num">已发</th><th class="num">单价</th><th class="num">金额</th></tr></thead><tbody>${items}</tbody></table>
      <h4 style="margin:16px 0 6px">状态轨迹</h4>${steps || `<div class="empty">暂无轨迹</div>`}
      ${actions.length ? `<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">${actions.join("")}</div>` : ""}`,
  });
  const root = $("#modalRoot");
  root.querySelectorAll("[data-act]").forEach((b) =>
    b.addEventListener("click", async () => {
      const kind = b.dataset.act;
      try {
        if (kind === "confirm") await POST(`/orders/${id}/confirm`);
        else if (kind === "deliver")
          await POST(`/orders/${id}/deliver`, {
            items: d.items.map((i) => ({ item_id: i.id, delivered_quantity: i.quantity })),
            logistics_company: "北屯物流有限公司",
            logistics_no: "BTWL" + String(Date.now()).slice(-8),
          });
        else if (kind === "complete") await POST(`/orders/${id}/complete`);
        else if (kind === "cancel") await POST(`/orders/${id}/cancel`, { reason: "控制台操作取消" });
        else if (kind === "contract") await POST("/contracts", { order_id: id });
        toast("操作成功", "ok");
        $("#modalRoot").innerHTML = "";
        await onDone();
      } catch (e) { toast(e.message, "err"); }
    })
  );
}

            <td>${esc(e.aggregate_type)}<br /><span class="muted mono">${esc(e.aggregate_id || "")}</span></td>
            <td><span class="tag ${e.status === "success" ? "green" : e.status === "failed" ? "red" : "orange"}">${esc(e.status)}</span></td>
            <td class="num">${int(e.retry_count)}</td><td class="muted">${dt(e.created_at)}</td></tr>`).join("")}</tbody></table></div></div></div>
    </div>`;
  const pushBtn = root.querySelector("[data-push]");
  if (pushBtn)
    pushBtn.addEventListener("click", async () => {
      try {
        const r = await POST("/integration/odoo/push-now", {});
        toast(`推送完成：成功 ${r.success} / 失败 ${r.failed}`, "ok");
        await route();
      } catch (e) { toast(e.message, "err"); }
    });
};

/* =============================== 启动流程 =============================== */
function showLogin() {
  $("#app").style.display = "none";
  $("#login").style.display = "flex";
}
function showApp() {
  $("#login").style.display = "none";
  $("#app").style.display = "block";
  const roles = (store.user.role_names || []).join("、");
  $("#whoami").textContent = `${store.user.full_name || store.user.username}（${roles || "无角色"}）` +
    (store.user.enterprise_name ? " · " + store.user.enterprise_name : "");
  route();
}

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = $("#loginUser").value.trim();
  const password = $("#loginPass").value;
  try {
    const data = await api("/auth/login", { method: "POST", body: { username, password } });
    store.token = data.access_token;
    store.user = data.user;
    localStorage.setItem("gz_token", store.token);
    toast("登录成功，欢迎 " + (data.user.full_name || data.user.username), "ok");
    showApp();
  } catch (err) {
    toast(err.message, "err");
  }
});

$("#logoutBtn").addEventListener("click", async () => {
  try { await POST("/auth/logout", {}); } catch (e) { /* 忽略 */ }
  store.token = "";
  store.user = null;
  localStorage.removeItem("gz_token");
  showLogin();
});

window.addEventListener("hashchange", () => {
  if (store.user) route();
});

(async function boot() {
  if (!store.token) return showLogin();
  try {
    store.user = await GET("/auth/me");
    showApp();
  } catch (e) {
    showLogin();
  }
})();
</script>
</body>
</html>
